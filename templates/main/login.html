{% extends 'base.html' %}
{% block title %}Login{% endblock title %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Error Alert -->
        {% if error %}
        <div class="bg-red-50 p-4 rounded-lg shadow-md mb-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-red-800">
                        {{ error }}
                    </p>
                </div>
                <div class="ml-auto pl-3">
                    <div class="-mx-1.5 -my-1.5">
                        <button onclick="this.closest('.bg-red-50').style.display = 'none';" class="inline-flex bg-red-50 rounded-md p-1.5 text-red-500 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-red-50 focus:ring-red-600">
                            <span class="sr-only">Dismiss</span>
                            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Login Card -->
        <div class="bg-white shadow-2xl rounded-lg px-8 pt-6 pb-8 mb-4">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900">Welcome back</h2>
                <p class="mt-2 text-sm text-gray-600">Sign in to your account</p>
            </div>

            <form action="{% url 'main:logged_in' %}" method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700" for="username">
                        Username
                    </label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm 
                        placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 
                        focus:border-blue-500 sm:text-sm" type="text" 
                        placeholder="Enter your username" name="username" 
                        id="username" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700" for="password">
                        Password
                    </label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm 
                        placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 
                        focus:border-blue-500 sm:text-sm" type="password" 
                        placeholder="Enter your password" name="password" 
                        id="password" required>
                </div>

                <div>
                    <button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md 
                        shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 
                        focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 
                        transition duration-150 ease-in-out" type="submit">
                        Sign in
                    </button>
                </div>

                <div class="flex flex-col space-y-2 text-sm text-center">
                    <a class="text-blue-600 hover:text-blue-800 transition-colors duration-150" 
                        href="{% url 'main:signup'%}">
                        Don't have an account? Sign up
                    </a>
                    <a class="text-blue-600 hover:text-blue-800 transition-colors duration-150" 
                        href="{% url 'mail:index'%}">
                        Forgot your password?
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock body %}
